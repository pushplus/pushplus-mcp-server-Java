spring:
  application:
    name: pushplus-mcp
  main:
    # 必须禁用web应用类型
    web-application-type: none
    # 禁用banner
    banner-mode: off
  ai:
    mcp:
      server:
        # 启用stdio模式
        stdio: true
        # 服务器名称
        name: pushplus-mcp-server
        # 服务器版本
        version: 1.0.5

pushplus:
  base-url: ${PUSHPLUS_BASE_URL:https://www.pushplus.plus}
  # 可由 base-url 推导；保留显式覆盖能力
  url: ${PUSHPLUS_SEND_URL:}
  batch-url: ${PUSHPLUS_BATCH_URL:}
  # 用户 token（发送与开放接口共用）
  token: ${PUSHPLUS_TOKEN:}
  # 开放接口 secretKey
  secret-key: ${PUSHPLUS_SECRET_KEY:}
